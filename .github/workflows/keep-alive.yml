name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://ltpapowuiglswfgvrkjr.supabase.co"
          
          # Replace this with your exact sb_publishable_... key
          KEY="sb_publishable_Y5IpJNJEmy9Exo_hDaOsPg_6KtG8dSx"
          
          echo "Sending heartbeat to Supabase..."

          # This captures both the response message AND the status code
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET "$URL/rest/v1/ping?select=id" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          BODY=$(echo "$RESPONSE" | sed '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1)
          
          echo "----------------------------------------"
          echo "Status Code: $STATUS"
          echo "Server Response: $BODY"
          echo "----------------------------------------"

          if [ "$STATUS" -ne 200 ]; then
            echo "Heartbeat failed! Read the Server Response above to see exactly why Supabase rejected it."
            exit 1
          fi
          
          echo "Success! Inactivity timer reset."

name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          URL="https://ltpapowuiglswfgvrkjr.supabase.co"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0cGFwb3d1aWdsc3dmZ3Zya2pyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjExMjgsImV4cCI6MjEwMjY5NzEyOH0.GvGmvrK6ngQwZQVb5oCAvwZLai7g3SGrxqiCE1-HyFQ"
          
          CLEAN_URL=$(echo $URL | sed 's:/*$::')
          
          echo "Sending heartbeat to Supabase..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$CLEAN_URL/rest/v1/ping?select=id" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Supabase response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Heartbeat ping failed! Expected HTTP 200."
            exit 1
          fi
          
          echo "Supabase successfully pinged. Inactivity timer reset."
        

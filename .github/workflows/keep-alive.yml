name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Strip any trailing slash from the URL to prevent double-slashes in the API path
          CLEAN_URL=$(echo $URL | sed 's:/*$::')
          
          # Check if the secret is actually loading
          if [ -z "$KEY" ]; then
            echo "Error: VITE_SUPABASE_ANON_KEY is empty. GitHub Actions cannot see the secret."
            exit 1
          fi
          
          echo "Sending heartbeat to Supabase..."

          # Send the authenticated ping request
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$CLEAN_URL/rest/v1/ping?select=id" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Supabase response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Heartbeat ping failed! Expected HTTP 200."
            exit 1
          fi
          
          echo "Supabase successfully pinged. Inactivity timer reset."

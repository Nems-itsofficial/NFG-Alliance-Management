name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 04:00 UTC (keeps the 7-day inactivity timer reset)
    - cron: '0 4 */3 * *'
  workflow_dispatch: # Allows you to manually trigger it anytime to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/ping?select=id" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          echo "Supabase response status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Heartbeat ping failed! Expected HTTP 200."
            exit 1
          fi
          
          echo "Supabase successfully pinged. Inactivity timer reset."

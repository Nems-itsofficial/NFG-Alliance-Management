name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    
    # We must grant write permissions so the bot can push the dummy commit
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          URL="https://ltpapowuiglswfgvrkjr.supabase.co"
          KEY="sb_publishable_Y5IpJNJEmy9Exo_hDaOsPg_6KtG8dSx"
          
          echo "Sending heartbeat to Supabase..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X GET "$URL/rest/v1/ping?select=id" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          STATUS=$(echo "$RESPONSE" | tail -n1)

          if [ "$STATUS" -ne 200 ]; then
            echo "Heartbeat failed! Status: $STATUS"
            exit 1
          fi
          
          echo "Success! Inactivity timer reset."

      - name: Keep GitHub Actions Alive
        run: |
          # Write the current date to a hidden file
          date > .github-keepalive.txt
          
          # Configure the GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add and commit the file to bypass the 60-day suspension rule
          git add .github-keepalive.txt
          git commit -m "Automated keep-alive commit [skip ci]" || echo "No changes to commit"
          git push
